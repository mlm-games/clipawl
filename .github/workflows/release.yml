name: Release crate
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean
      bump_type:
        description: "Version bump type (none/patch/minor/major)"
        required: false
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@main
    with:
      auto-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_type != 'none' }}
      bump-type: ${{ inputs.bump_type }}
      create-release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
      system-deps: "libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}