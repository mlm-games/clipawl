name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install MSRV toolchain
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          rustup install "$MSRV"
          rustup default "$MSRV"

      - name: Check MSRV build
        run: cargo check --locked
        continue-on-error: true

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Clippy (async-io only)
        run: cargo clippy --all-targets --no-default-features --features async-io,linux-wayland,linux-x11 --locked -- -D warnings

      - name: Build
        run: cargo build --verbose --locked

      - name: Test
        run: cargo test --verbose --locked

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check wasm32
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Check no-default-features (wasm only -> native requires a runtime feature)
        run: cargo check --no-default-features --target wasm32-unknown-unknown --locked

  check-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Check Android
        run: cargo check --target aarch64-linux-android --locked

      - name: Build Android
        run: cargo build --target aarch64-linux-android --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
