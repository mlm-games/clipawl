[package]
name = "clipawl"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Clipboard API for Rust: Web (wasm), Android, and Linux (Wayland + X11) with a portable async API"
repository = "https://github.com/mlm-games/clipawl"
readme = "README.md"
keywords = ["clipboard", "wasm", "android", "linux", "cross-platform"]
categories = ["api-bindings", "wasm", "os"]

[features]
default = ["tokio", "linux-wayland", "linux-x11"]

## Pick exactly one runtime for blocking platform calls (JNI, X11 protocol,
## Wayland pipe I/O):
##
## If both are enabled, `tokio` takes priority.
tokio = ["dep:tokio"]
async-io = ["dep:async-io", "dep:blocking"]

linux-wayland = ["wl-clipboard-rs"]
linux-x11 = ["clipboard_x11"]

[dependencies]
cfg-if = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", optional = true, features = ["rt", "macros", "rt-multi-thread"] }
async-io = { version = "2", optional = true }
blocking = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "Clipboard",
  "ClipboardItem",
  "Blob",
  "BlobPropertyBag",
  "DomException",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard_x11 = { version = "0.4.3", optional = true }
wl-clipboard-rs = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }

[[example]]
name = "linux"
path = "examples/linux.rs"

[[example]]
name = "blocking"
path = "examples/blocking.rs"

[[example]]
name = "async_io"
path = "examples/async_io.rs"
required-features = ["async-io"]
